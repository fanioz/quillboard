<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="/src/styles.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quillboard</title>
  <script type="module" src="/src/main.ts" defer></script>
</head>

<body>
  <div class="app-container">
    <!-- Top Toolbar -->
    <header class="toolbar">
      <div class="toolbar-left">
        <h1 class="app-title">🪶 Quillboard</h1>
      </div>
      <div class="toolbar-center">
        <button id="btn-search" class="toolbar-btn search-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          Search
          <kbd>⌘K</kbd>
        </button>
      </div>
      <div class="toolbar-actions">
        <button id="btn-new" class="toolbar-btn primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          New
        </button>
        <button id="btn-edit" class="toolbar-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
          Edit
        </button>
        <button id="btn-delete" class="toolbar-btn danger">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          Delete
        </button>
      </div>
    </header>

    <!-- Kanban Board -->
    <main id="board" class="board">
      <!-- Columns will be rendered here -->
    </main>
  </div>

  <!-- Quick Search Modal (Cmd/Ctrl+K) -->
  <div id="search-modal" class="modal-overlay hidden">
    <div class="search-modal">
      <div class="search-modal-header">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <input type="text" id="search-input" placeholder="Search prompts..." autocomplete="off" />
        <kbd>ESC</kbd>
      </div>
      <ul id="search-results" class="search-results">
        <!-- Results will be rendered here -->
      </ul>
    </div>
  </div>

  <!-- New/Edit Prompt Modal -->
  <div id="prompt-modal" class="modal-overlay hidden">
    <div class="prompt-modal">
      <div class="modal-header">
        <h2 id="modal-title">New Prompt</h2>
        <button id="modal-close" class="modal-close">&times;</button>
      </div>
      <form id="prompt-form" class="modal-form">
        <div class="form-row">
          <label for="prompt-title">Title</label>
          <input type="text" id="prompt-title" placeholder="Enter prompt title..." required />
        </div>

        <div class="form-row">
          <label for="prompt-content">Content</label>
          <textarea id="prompt-content" placeholder="Enter your prompt..." rows="6" required></textarea>
        </div>

        <div class="form-row-group">
          <div class="form-row">
            <label for="prompt-column">Column</label>
            <select id="prompt-column">
              <!-- Options will be rendered here -->
            </select>
          </div>

          <div class="form-row">
            <label for="prompt-icon">Icon</label>
            <div class="icon-picker" id="icon-picker">
              <button type="button" class="icon-btn selected" data-icon="📝">📝</button>
              <button type="button" class="icon-btn" data-icon="💡">💡</button>
              <button type="button" class="icon-btn" data-icon="🚀">🚀</button>
              <button type="button" class="icon-btn" data-icon="⚡">⚡</button>
              <button type="button" class="icon-btn" data-icon="🎯">🎯</button>
              <button type="button" class="icon-btn" data-icon="🔧">🔧</button>
              <button type="button" class="icon-btn" data-icon="📊">📊</button>
              <button type="button" class="icon-btn" data-icon="✨">✨</button>
            </div>
          </div>
        </div>

        <div class="form-row-group">
          <div class="form-row">
            <label>Label</label>
            <div class="label-picker" id="label-picker">
              <button type="button" class="label-btn selected" data-label="none"
                style="background: var(--bg-tertiary)"></button>
              <button type="button" class="label-btn" data-label="red" style="background: #ef4444"></button>
              <button type="button" class="label-btn" data-label="orange" style="background: #f97316"></button>
              <button type="button" class="label-btn" data-label="yellow" style="background: #eab308"></button>
              <button type="button" class="label-btn" data-label="green" style="background: #22c55e"></button>
              <button type="button" class="label-btn" data-label="blue" style="background: #3b82f6"></button>
              <button type="button" class="label-btn" data-label="purple" style="background: #a855f7"></button>
            </div>
          </div>

          <div class="form-row">
            <label for="prompt-tags">Tags</label>
            <input type="text" id="prompt-tags" placeholder="coding, writing, etc." />
          </div>
        </div>

        <!-- Advanced Options -->
        <details class="advanced-options">
          <summary>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"></circle>
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
              </path>
            </svg>
            Advanced Options
          </summary>
          <div class="advanced-content">
            <div class="form-row-group">
              <div class="form-row">
                <label for="prompt-model">Model</label>
                <input type="text" id="prompt-model" placeholder="gpt-4, claude-3-sonnet, etc." value="gpt-4" />
              </div>
              <div class="form-row">
                <label for="prompt-temp">Temperature</label>
                <div class="range-input">
                  <input type="range" id="prompt-temp" min="0" max="2" step="0.1" value="0.7" />
                  <span id="temp-value">0.7</span>
                </div>
              </div>
            </div>
            <div class="form-row-group">
              <div class="form-row">
                <label for="prompt-topk">Top K</label>
                <input type="number" id="prompt-topk" min="1" max="100" value="40" placeholder="40" />
              </div>
              <div class="form-row">
                <label for="prompt-maxtokens">Max Tokens</label>
                <input type="number" id="prompt-maxtokens" min="1" max="32000" value="2048" placeholder="2048" />
              </div>
            </div>
          </div>
        </details>

        <div class="form-actions">
          <button type="button" id="btn-cancel" class="btn-secondary">Cancel</button>
          <button type="submit" class="btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- View/Copy Prompt Modal -->
  <div id="view-modal" class="modal-overlay hidden">
    <div class="view-modal">
      <div class="modal-header">
        <div class="view-title">
          <span id="view-icon" class="view-icon">📝</span>
          <h2 id="view-title-text">Prompt Title</h2>
        </div>
        <button id="view-close" class="modal-close">&times;</button>
      </div>
      <div class="view-tags" id="view-tags"></div>
      <div class="view-content" id="view-content">
        <!-- Content here -->
      </div>
      <div class="view-actions">
        <button id="btn-copy" class="btn-secondary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          Copy
        </button>
        <button id="btn-open-edit" class="btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
          Edit
        </button>
      </div>
    </div>
  </div>
</body>

</html>
